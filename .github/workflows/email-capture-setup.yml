name: Email capture setup (temporary)

# Temporary helper. It creates a disposable capture mailbox and records its
# connection settings on a tracking issue, because this environment can read
# api.github.com but not the Actions log endpoint. Both the mailbox and the issue
# are throwaway; nothing here touches a real account or secret.
on:
  push:
    paths:
      - ".github/workflows/email-capture-setup.yml"

permissions:
  issues: write

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create a disposable capture mailbox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -sS -X POST https://api.nodemailer.com/user \
            -H 'Content-Type: application/json' \
            -d '{"requestor":"aanapurna-link-email-verification","version":"1.0"}')
          echo "$response" | jq -e '.user and .pass and .smtp.host' > /dev/null
          payload=$(printf '%s' "$response" | jq -c '{user, pass, smtp, web}')
          body=$(jq -Rn --arg p "$payload" '{"title":"TEMP: email capture mailbox (delete after verification)","body":("Disposable capture mailbox created by the temporary verification workflow. Throwaway credentials, not an account credential.\n\n```json\n" + $p + "\n```")}')
          curl -sS -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            -d "$body" | jq -r '.html_url'
