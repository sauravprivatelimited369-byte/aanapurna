name: Email capture setup (temporary)

# Temporary helper: creates a disposable capture mailbox so the deployed
# application can be shown performing a real SMTP delivery. Removed once the
# verification is recorded. It creates no secret for any real account.
on:
  push:
    paths:
      - ".github/workflows/email-capture-setup.yml"

permissions: {}

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create a disposable capture mailbox
        run: |
          set -euo pipefail
          response=$(curl -sS -X POST https://api.nodemailer.com/user \
            -H 'Content-Type: application/json' \
            -d '{"requestor":"aanapurna-link-email-verification","version":"1.0"}')
          status=$(printf '%s' "$response" | jq -r '.status // "ok"')
          echo "creation status: $status"
          printf '%s' "$response" | jq '{user, pass, smtp, web}'
