name: Close temporary tracking issues

# One-shot cleanup: closes the temporary tracking issues created while proving
# the live email path. Removed in the next commit.
on:
  push:
    paths:
      - ".github/workflows/email-verification.yml"

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close the temporary tracking issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for number in 7 8; do
            curl -sS -X PATCH "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$number" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Content-Type: application/json' \
              -d '{"state":"closed","body":"Closed: this temporary record was consumed by the verification run recorded in HOSTED_DEPLOYMENT.md."}' \
              | jq -r '"#" + (.number|tostring) + " " + .state'
          done
