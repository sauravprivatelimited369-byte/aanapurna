name: Canonical host origin check (temporary)

# One-shot check that the new canonical hostname accepts form posts and that an
# untrusted origin is still rejected. Removed in the next commit.
on:
  push:
    paths:
      - ".github/workflows/email-verification.yml"

permissions: {}

jobs:
  origins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Canonical host serves a healthy app
        run: |
          set -euo pipefail
          curl -sS https://annapurna-link.vercel.app/api/health -o health.json
          cat health.json
          jq -e '.status == "ok" and .database.status == "ok" and .email.status == "test_sink"' health.json > /dev/null

      - name: Form posts are accepted from the canonical host and the old alias, and refused from a stranger
        run: |
          set -euo pipefail
          probe() {
            curl -sS -o /dev/null -w '%{http_code}' -X POST "$1/api/register" \
              -H 'Content-Type: application/json' -H "Origin: $2" -d '{}'
          }
          canonical=$(probe https://annapurna-link.vercel.app https://annapurna-link.vercel.app)
          alias=$(probe https://annapurna-link.vercel.app https://aanapurna-link-preview.vercel.app)
          stranger=$(probe https://annapurna-link.vercel.app https://not-our-site.example)
          echo "canonical=$canonical alias=$alias stranger=$stranger"
          # A trusted origin reaches request validation; an untrusted origin is
          # rejected before it. 400 = accepted origin, 4xx-not-400 = refused.
          test "$canonical" != "403"
          test "$alias" != "403"
          test "$stranger" = "403"
