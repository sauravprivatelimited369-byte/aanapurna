name: Canonical host origin check (temporary)

# One-shot check that Better Auth accepts posts from the canonical hostname and
# the previous alias, and still refuses a stranger's origin. Removed next commit.
on:
  push:
    paths:
      - ".github/workflows/email-verification.yml"

permissions: {}

jobs:
  origins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Canonical host serves a healthy app
        run: |
          set -euo pipefail
          curl -sS https://annapurna-link.vercel.app/api/health -o health.json
          cat health.json
          jq -e '.status == "ok" and .database.status == "ok" and .email.status == "test_sink"' health.json > /dev/null

      - name: Canonical origin is trusted
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            https://annapurna-link.vercel.app/api/auth/sign-in/email \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://annapurna-link.vercel.app' \
            -d '{"email":"nobody@example.com","password":"not-a-real-password"}')
          echo "canonical origin status: $code"
          test "$code" != "403"

      - name: Previous alias origin stays trusted
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            https://annapurna-link.vercel.app/api/auth/sign-in/email \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://aanapurna-link-preview.vercel.app' \
            -d '{"email":"nobody@example.com","password":"not-a-real-password"}')
          echo "alias origin status: $code"
          test "$code" != "403"

      - name: A stranger origin is refused
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            https://annapurna-link.vercel.app/api/auth/sign-in/email \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://not-our-site.example' \
            -d '{"email":"nobody@example.com","password":"not-a-real-password"}')
          echo "stranger origin status: $code"
          test "$code" = "403"
