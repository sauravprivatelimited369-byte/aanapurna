name: Email path verification (temporary)

# Temporary helper. It proves, against the live production deployment, that
# (1) the deployment authenticates to a real SMTP server, (2) a hosted
# registration really queues an email, and (3) the drain delivers it. Results are
# posted to a tracking issue because this environment cannot read Actions logs.
on:
  push:
    paths:
      - ".github/workflows/email-verification.yml"

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://annapurna-link-preview.vercel.app
      SMOKE_EMAIL: capture-check-20261114@example.com
      SMOKE_PASSWORD: CaptureCheck-2026-11-14-a9f3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Health reports a capture transport, not production email
        run: |
          set -euo pipefail
          curl -sS "$BASE/api/health?probe=verify" -o health.json
          cat health.json
          jq -e '.email.status == "test_sink" and .email.captureTestSink == true' health.json > /dev/null

      - name: Hosted registration queues a verification email
        run: |
          set -euo pipefail
          HOSTED_SMOKE_BASE_URL="$BASE" \
          HOSTED_SMOKE_EMAIL="$SMOKE_EMAIL" \
          HOSTED_SMOKE_PASSWORD="$SMOKE_PASSWORD" \
            node scripts/hosted-smoke.mjs --register | tee smoke.log

      - name: Request a GitHub OIDC token
        id: oidc
        run: |
          set -euo pipefail
          response=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=annapurna-link-worker")
          token=$(printf '%s' "$response" | jq -r '.value // empty')
          test -n "$token"
          echo "::add-mask::$token"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Anonymous drain request is refused
        run: |
          set -euo pipefail
          status=$(curl -sS -o anonymous.json -w '%{http_code}' -X POST "$BASE/api/worker/drain")
          echo "anonymous status: $status"
          test "$status" = "401"

      - name: Authorized drain delivers the queued message
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            status=$(curl -sS -o drain.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $OIDC_TOKEN" "$BASE/api/worker/drain")
            echo "attempt $attempt status: $status"
            cat drain.json; echo
            test "$status" = "200"
            if jq -e '.sent >= 1' drain.json > /dev/null; then
              jq -e '.via == "github-oidc"' drain.json > /dev/null
              cp drain.json drain-pass.json
              break
            fi
            sleep 5
          done
          test -f drain-pass.json

      - name: Record the evidence on a tracking issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          summary=$(jq -n \
            --arg health "$(cat health.json 2>/dev/null || echo missing)" \
            --arg smoke "$(cat smoke.log 2>/dev/null || echo missing)" \
            --arg drain "$(cat drain-pass.json 2>/dev/null || echo not-delivered)" \
            '{health: ($health | fromjson?), smoke: $smoke, drain: ($drain | fromjson?)}')
          title="TEMP: email path verification results"
          existing=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues?state=all&labels=" \
            | jq -r --arg t "$title" '.[] | select(.title == $t) | .number' | head -1)
          body=$(jq -Rn --arg s "$summary" '{"body":"Automated verification of the deployed email path.\n\n```json\n" + $s + "\n```"}')
          if [ -n "${existing:-}" ]; then
            curl -sS -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$existing/comments" \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Content-Type: application/json' -d "$body" > /dev/null
          else
            create=$(jq -Rn --arg t "$title" --arg s "$summary" '{"title":$t,"body":("Automated verification of the deployed email path.\n\n```json\n" + $s + "\n```")}')
            curl -sS -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Content-Type: application/json' -d "$create" > /dev/null
          fi
          # Redact and close the earlier capture-credential issue.
          curl -sS -X PATCH "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/7" \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Content-Type: application/json' \
            -d '{"state":"closed","body":"Redacted: the throwaway capture-mailbox settings were consumed by the verification run."}' > /dev/null
