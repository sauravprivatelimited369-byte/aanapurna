name: After-response delivery probe (temporary)

# One request to the live site, for the fictional account an earlier smoke check created
# (capture-check-...@example.com), and then a look at /api/health. It answers the one question no
# build sandbox can: does Vercel keep a function alive for the work it does after it has answered?
#
# It touches no real person's account, reads no secret, and is removed by the next commit. It runs
# only for the push that adds this file.

on:
  push:
    branches:
      - arena/62186364-aanapurna
    paths:
      - .github/workflows/after-response-probe.yml

permissions: {}

jobs:
  probe:
    name: One request, then watch /api/health
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASE: https://annapurna-link.vercel.app
      ADDRESS: capture-check-43581866389@example.com
    steps:
      - name: Health before
        run: |
          set -euo pipefail
          curl -sS "$BASE/api/health" | jq -c '{status, delivery, email: .email.status}'

      - name: Ask for a fresh verification link for the fictional account
        run: |
          set -euo pipefail
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Origin: $BASE" \
            -H "Content-Type: application/json" \
            --data "{\"email\":\"$ADDRESS\",\"callbackURL\":\"/verify-email?result=verified\"}" \
            "$BASE/api/auth/send-verification-email")
          echo "status: $status"
          cat response.json
          echo
          test "$status" = "200"

      - name: Wait for the pass that follows the response
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            sleep 3
            body=$(curl -sS "$BASE/api/health")
            echo "$attempt: $(printf '%s' "$body" | jq -c '.delivery')"
            if [ "$(printf '%s' "$body" | jq -r '.delivery.afterResponse.status')" = "seen" ]; then
              exit 0
            fi
          done
          echo "no pass was recorded within a minute of the request"
          exit 1
