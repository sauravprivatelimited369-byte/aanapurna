name: Worker drain

# The Vercel deployment cannot host the long-lived Graphile Worker, so this
# scheduled workflow drives one outbox batch at a time. It authenticates with a
# GitHub Actions OIDC token, so there is no shared secret to store, rotate or
# leak: the endpoint verifies the token's signature, audience, repository and ref.
#
# Authenticated drain requests never print the token or any email content.

on:
  schedule:
    # GitHub's minimum schedule granularity is five minutes, and scheduled runs
    # can be queued later than their slot during peak load.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: worker-drain
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://aanapurna-link-preview.vercel.app
    steps:
      - name: Reject an anonymous request
        run: |
          set -euo pipefail
          status=$(curl -sS -o anonymous.json -w '%{http_code}' -X POST "$BASE/api/worker/drain")
          echo "anonymous status: $status"
          test "$status" = "401"

      - name: Request a GitHub OIDC token
        id: oidc
        run: |
          set -euo pipefail
          response=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=annapurna-link-worker")
          token=$(printf '%s' "$response" | jq -r '.value // empty')
          test -n "$token"
          echo "::add-mask::$token"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Drain the email outbox
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o drain.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$BASE/api/worker/drain")
          cat drain.json
          echo
          echo "drain status: $status"
          test "$status" = "200"
          jq -e '.status == "ok" or .status == "deferred"' drain.json > /dev/null
