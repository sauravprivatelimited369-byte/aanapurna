name: Publish GitHub Pages site

on:
  push:
    branches:
      - main
      - arena/fb39ea45-aanapurna
    paths:
      - "github-pages/**"
      - "public/fonts/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static frontend
        env:
          ANNAPURNA_BACKEND_URL: ${{ vars.ANNAPURNA_BACKEND_URL }}
        run: |
          mkdir -p _site/fonts
          cp github-pages/index.html github-pages/styles.css github-pages/site.js _site/
          cp public/fonts/manrope-latin-variable.woff2 public/fonts/playfair-display-latin-variable.woff2 _site/fonts/
          touch _site/.nojekyll
          node -e 'const fs=require("node:fs"); const value=(process.env.ANNAPURNA_BACKEND_URL||"").trim(); fs.writeFileSync("_site/config.js", "window.ANNAPURNA_BACKEND_URL = "+JSON.stringify(value)+";\n");'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
