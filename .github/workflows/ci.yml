name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create ephemeral local-only environment
        run: npm run setup:env

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and migration tests
        run: npm test -- --reporter=dot

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e -- --workers=1 --timeout=120000

      - name: Audit dependencies
        run: |
          npm audit --audit-level=moderate
          npm audit --omit=dev --audit-level=moderate

      - name: Production build
        run: npm run build

  native-postgres:
    name: Native PostgreSQL and authentication smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup:env
      - name: Configure isolated test database
        run: node -e "const fs=require('fs'); const p='.env'; fs.writeFileSync(p,fs.readFileSync(p,'utf8').replaceAll('annapurna_link','annapurna_link_test'))"
      - name: Bootstrap disposable PostgreSQL and migrate
        env:
          PG_ADMIN_URL: postgres://postgres:ci-only-disposable-password@127.0.0.1:5432/postgres
        run: |
          npm run local:db:setup
          npm run local:migrate
      - name: Real PostgreSQL domain and RLS integration
        env:
          RUN_LOCAL_DOMAIN_TEST: 'true'
        run: npm run test:local-domain
      - name: Disposable PostgreSQL backup and restore
        env:
          RUN_LOCAL_BACKUP_TEST: 'true'
        run: npm run test:local-backup
      - name: Check local signup, email, reset and revocation
        env:
          RUN_LOCAL_AUTH_TEST: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          node --env-file=.env scripts/local-start.mjs > /tmp/annapurna-local-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node -e "const end=Date.now()+90000; (async function wait(){try{const r=await fetch('http://localhost:3000/api/health'); if(r.ok)return;}catch{} if(Date.now()>end)process.exit(1); setTimeout(wait,500);})()"
          npm run test:local-auth

  browser-workflow:
    name: Disposable PostgreSQL browser workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup:env
      - name: Configure isolated test database
        run: node -e "const fs=require('fs'); const p='.env'; fs.writeFileSync(p,fs.readFileSync(p,'utf8').replaceAll('annapurna_link','annapurna_link_test'))"
      - name: Bootstrap disposable database and migrate
        env:
          PG_ADMIN_URL: postgres://postgres:ci-only-disposable-password@127.0.0.1:5432/postgres
        run: |
          npm run local:db:setup
          npm run local:migrate
      - run: npx playwright install --with-deps chromium
      - name: Browser handover workflow
        env:
          RUN_LOCAL_WORKFLOW_TEST: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run test:local-workflow

  compose-smoke:
    name: Docker Compose build and health smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run setup:env
      - name: Build and start local containers
        shell: bash
        run: |
          set +e
          docker compose up --build --detach --wait --wait-timeout 180 > "$RUNNER_TEMP/compose-smoke.log" 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            # The stack has only generated throwaway credentials. Still filter out
            # possible secret-bearing database lines before adding a diagnostic.
            diagnostic="$( { tail -n 18 "$RUNNER_TEMP/compose-smoke.log"; docker compose ps -a 2>&1; docker compose logs --tail=12 migrate web worker 2>&1; } | grep -viE 'password|secret|postgres://|_key=' | head -c 6000 )"
            diagnostic="${diagnostic//'%'/'%25'}"; diagnostic="${diagnostic//$'\r'/'%0D'}"; diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Compose diagnostic::$diagnostic"
            exit "$result"
          fi
          echo 'Compose stack started.'
      - name: Check database role and app health
        run: |
          docker compose run --rm web npm run db:check
          curl --fail --silent http://127.0.0.1:3000/api/health
          curl --fail --silent --output /dev/null http://127.0.0.1:8025/
      - name: Tear down disposable stack
        if: always()
        run: docker compose down -v

  windows-native:
    name: Windows native launcher and authentication
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: '--dns-result-order=ipv4first'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup:env
      - name: Start the runner's disposable PostgreSQL and configure test database
        shell: pwsh
        run: |
          Set-Service -Name postgresql-x64-17 -StartupType Manual
          Start-Service -Name postgresql-x64-17
          $path = '.env'
          $content = [IO.File]::ReadAllText($path).Replace('annapurna_link', 'annapurna_link_test')
          [IO.File]::WriteAllText($path, $content)
      - name: Bootstrap and migrate
        env:
          PG_ADMIN_URL: postgres://postgres:root@127.0.0.1:5432/postgres
        shell: pwsh
        run: |
          npm run local:db:setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run local:migrate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise start.bat and local authentication
        env:
          RUN_LOCAL_AUTH_TEST: 'true'
        shell: pwsh
        run: |
          $server = Start-Process -FilePath cmd.exe -ArgumentList '/c','start.bat' -WorkingDirectory $PWD -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 120; $i++) {
              try { $health = Invoke-RestMethod -Uri 'http://127.0.0.1:3000/api/health' -TimeoutSec 2; if ($health.realOperationsEnabled -eq $false) { $ready = $true; break } } catch {}
              Start-Sleep -Seconds 1
            }
            if (!$ready) { throw 'Windows launcher did not start a healthy, operations-disabled server.' }
            $authOutput = & npm.cmd run test:local-auth 2>&1
            $authResult = $LASTEXITCODE
            if ($authResult -ne 0) {
              $diagnostic = ($authOutput | Out-String).Trim()
              if ($diagnostic.Length -gt 1800) { $diagnostic = $diagnostic.Substring(0, 1800) }
              throw "Windows authentication smoke test failed: $diagnostic"
            }
            Write-Output 'Windows local authentication smoke test passed.'
          } catch {
            $diagnostic = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows smoke diagnostic::$diagnostic"
            throw
          } finally {
            & taskkill /PID $server.Id /T /F 2>$null | Out-Null
          }

  windows-managed:
    name: Windows one-click first start and persistence
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: '--dns-result-order=ipv4first'
      RUN_LOCAL_AUTH_TEST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: First start, authenticated test, and restart
        shell: pwsh
        run: |
          $diagnosticPath = Join-Path $PWD '.local-data/windows-launch-diagnostic.txt'
          New-Item -ItemType Directory -Force -Path '.local-data' | Out-Null
          Set-Content -Path $diagnosticPath -Value 'Windows launcher diagnostic not yet captured.'
          # PostgreSQL refuses elevated Windows processes. Exercise a standard
          # user just as a normal double-click would, not the elevated CI account.
          $username = 'annapurna-ci'
          $temporaryPassword = ConvertTo-SecureString ([guid]::NewGuid().ToString() + 'Aa1!') -AsPlainText -Force
          New-LocalUser -Name $username -Password $temporaryPassword -PasswordNeverExpires | Out-Null
          $credential = [System.Management.Automation.PSCredential]::new(".\$username", $temporaryPassword)
          & icacls $PWD /grant "${username}:(OI)(CI)M" /T /C /Q | Out-Null
          New-Item -ItemType Directory -Force -Path '.local-data/npm-cache','.local-data/tmp' | Out-Null
          & icacls '.local-data' /grant "${username}:(OI)(CI)M" /T /C /Q | Out-Null
          $env:npm_config_cache = Join-Path $PWD '.local-data/npm-cache'
          $env:TEMP = Join-Path $PWD '.local-data/tmp'
          $env:TMP = $env:TEMP
          function Wait-Ready {
            $deadline = (Get-Date).AddSeconds(120)
            while ((Get-Date) -lt $deadline) {
              if ($server -and $server.HasExited) { throw 'Managed launcher exited before becoming healthy.' }
              $log = Get-Content "$env:RUNNER_TEMP\launch-*.out" -Tail 15 -ErrorAction SilentlyContinue | Out-String
              if ($log -match 'Startup failed|Dependency installation failed|Local startup failed') { throw 'Managed launcher reported a startup failure.' }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:3000/api/health' -TimeoutSec 2
                if ($health.realOperationsEnabled -eq $false) { return }
              } catch {}
              Start-Sleep -Seconds 1
            }
            throw 'Managed launcher did not become healthy with operations disabled.'
          }
          function Start-Launcher {
            param([string]$Suffix)
            return Start-Process -FilePath cmd.exe -ArgumentList '/c','start.bat' -WorkingDirectory $PWD -PassThru -WindowStyle Hidden -Credential $credential -LoadUserProfile -RedirectStandardOutput "$env:RUNNER_TEMP\launch-$Suffix.out" -RedirectStandardError "$env:RUNNER_TEMP\launch-$Suffix.err"
          }
          function Stop-Launcher {
            param($Server)
            if ($Server -and !$Server.HasExited) { & taskkill /PID $Server.Id /T /F 2>$null | Out-Null }
            for ($i = 0; $i -lt 30; $i++) {
              if (!(Get-NetTCPConnection -State Listen -LocalPort 3000,55432 -ErrorAction SilentlyContinue)) { return }
              Start-Sleep -Seconds 1
            }
            throw 'Managed launcher ports did not close after stopping the process tree.'
          }
          $server = $null
          try {
            $server = Start-Launcher 'first'
            Wait-Ready
            npm run test:local-auth
            if ($LASTEXITCODE -ne 0) { throw 'Managed local authentication smoke failed.' }
            Stop-Launcher $server
            $server = Start-Launcher 'restart'
            Wait-Ready
            @'
          const {Client} = require('pg');
          (async () => { const c = new Client({connectionString:process.env.MIGRATION_DATABASE_URL}); await c.connect(); const r = await c.query('SELECT count(*)::int AS count FROM public."user"'); await c.end(); if (r.rows[0].count < 1) throw Error('Fictional account missing after restart.'); console.log('PASS: fictional account persisted after restart.'); })().catch(() => { console.error('Persistence check failed.'); process.exit(1); });
          '@ | Set-Content -Path '.local-data/check-persistence.cjs' -Encoding utf8
            node --env-file=.env .local-data/check-persistence.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Managed database persistence check failed.' }
          } catch {
            $diag = $_.Exception.Message
            $logs = Get-Content "$env:RUNNER_TEMP\launch-*.out","$env:RUNNER_TEMP\launch-*.err" -ErrorAction SilentlyContinue | Where-Object { $_ -notmatch 'password|secret|postgres://|_KEY=' } | Select-Object -Last 25
            $diag = ($diag + ' ' + ($logs -join ' ')).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Set-Content -Path $diagnosticPath -Value $diag
            Write-Output "::error title=Managed launcher diagnostic::$diag"
            throw
          } finally {
            if ($server -and !$server.HasExited) { & taskkill /PID $server.Id /T /F 2>$null | Out-Null }
          }
      - name: Preserve sanitized Windows launcher diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-launch-diagnostics
          path: .local-data/windows-launch-diagnostic.txt
          if-no-files-found: ignore
          retention-days: 1
